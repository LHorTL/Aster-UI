name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - '.github/workflows/publish.yml'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  check:
    name: Check Version Against npm
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version_check.outputs.should_publish }}
      version: ${{ steps.version_check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare package.json version with npm registry
        id: version_check
        shell: bash
        run: |
          node --input-type=module << 'EOF'
          import fs from "node:fs";

          const pkg = JSON.parse(fs.readFileSync("./package.json", "utf8"));
          const name = pkg.name;
          const localVersion = String(pkg.version || "").trim();
          const refName = process.env.GITHUB_REF_NAME || "";
          const refType = process.env.GITHUB_REF_TYPE || "";

          function parseSemver(v) {
            const m = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/.exec(v);
            if (!m) return null;
            return {
              major: Number(m[1]),
              minor: Number(m[2]),
              patch: Number(m[3]),
              prerelease: m[4] ?? null,
            };
          }

          function compareCore(a, b) {
            if (a.major !== b.major) return a.major - b.major;
            if (a.minor !== b.minor) return a.minor - b.minor;
            return a.patch - b.patch;
          }

          const parsedLocal = parseSemver(localVersion);
          if (!parsedLocal) {
            console.error(`Invalid semver in package.json: "${localVersion}"`);
            process.exit(1);
          }

          if (refType === "tag" && refName !== `v${localVersion}`) {
            console.error(`Git tag "${refName}" does not match package.json version "v${localVersion}"`);
            process.exit(1);
          }

          const url = `https://registry.npmjs.org/${encodeURIComponent(name)}`;
          const res = await fetch(url, { headers: { Accept: "application/json" } });

          let shouldPublish = false;
          if (res.status === 404) {
            console.log(`Package ${name} is not yet published on npm. Will publish initial v${localVersion}.`);
            shouldPublish = true;
          } else if (res.ok) {
            const meta = await res.json();
            const publishedVersions = meta.versions ? Object.keys(meta.versions) : [];
            const latest = meta["dist-tags"]?.latest ?? null;

            if (publishedVersions.includes(localVersion)) {
              console.log(`${name}@${localVersion} is already published on npm. Skipping publish.`);
              shouldPublish = false;
            } else if (latest && !parsedLocal.prerelease) {
              const parsedLatest = parseSemver(latest);
              if (parsedLatest && compareCore(parsedLocal, parsedLatest) <= 0) {
                console.log(`Local version ${localVersion} is not greater than npm latest (${latest}). Skipping publish.`);
                shouldPublish = false;
              } else {
                console.log(`Detected new release version ${localVersion} (npm latest: ${latest}). Proceeding to publish.`);
                shouldPublish = true;
              }
            } else {
              console.log(`Detected unpublished version ${localVersion}. Proceeding to publish.`);
              shouldPublish = true;
            }
          } else {
            console.error(`Failed to query npm registry (${res.status} ${res.statusText})`);
            process.exit(1);
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `should_publish=${shouldPublish}\nversion=${localVersion}\n`,
          );
          EOF

  publish:
    name: Verify, Publish & Tag Release
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Ensure latest npm CLI for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run lint:arch
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check:pkg
      - run: npm test
      - run: npm run build:showcase

      # 将已验证通过的产物独立打包，避免发布目录隐式重复触发 prepublishOnly
      - name: Pack validated package
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Publish validated tarball to npm via OIDC Trusted Publisher
        run: |
          version="${{ needs.check.outputs.version }}"
          npm publish "$RUNNER_TEMP/fangxinyan-aster-ui-$version.tgz" --provenance --access public

      - name: Create Git tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.check.outputs.version }}"
          tag="v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag -a "$tag" -m "chore(release): $tag"
            git push origin "refs/tags/$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
